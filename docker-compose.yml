# The app and Caddy together. Point your cloudflared tunnel's public hostname
# at http://<this machine's IP>:80. Only Caddy is published; the app stays on
# the internal network.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://cal.example.com # your public URL (passkeys and email links depend on it)
      APP_NAME: Calendar
      SIGNUP_MODE: invite # only the first user, or someone with an invite link, can sign up
      # SMTP_URL: smtps://user:pass@smtp.example.com:465
      # MAIL_FROM: Calendar <calendar@example.com>
    volumes:
      - ./data:/data # SQLite database and uploaded files. Back this folder up.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
