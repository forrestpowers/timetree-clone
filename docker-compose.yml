# The app as a Dockhand stack, served by Pangolin on the same machine.
# The app joins Pangolin's Docker network as "calendar-app", so a Pangolin
# resource on the local site can target http://calendar-app:3000. No ports
# are published on the host.
#
# Set APP_ORIGIN (required) and the optional variables below as stack
# environment variables, or in a .env file next to this file.
services:
  app:
    image: ghcr.io/forrestpowers/timetree-clone:latest # built by .github/workflows/image.yml
    build: . # `docker compose build` builds it locally instead
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your public URL, e.g. https://cal.example.com}
      APP_NAME: ${APP_NAME:-Calendar}
      SIGNUP_MODE: ${SIGNUP_MODE:-invite} # only the first user, or someone with an invite link, can sign up
      SMTP_URL: ${SMTP_URL:-} # e.g. smtps://user:pass@smtp.example.com:465; unset prints emails to the log
      MAIL_FROM: ${MAIL_FROM:-} # e.g. Calendar <calendar@example.com>
    volumes:
      - app_data:/data # SQLite database and uploaded files. Back this volume up.
    networks:
      pangolin:
        aliases:
          - calendar-app

networks:
  pangolin:
    external: true
    name: ${PANGOLIN_NETWORK:-pangolin} # the network Pangolin's own stack created

volumes:
  app_data:
