<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#1fa971" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<script>
			// Rendering depends on the device time zone; tell the server once, then reload.
			(function () {
				try {
					var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
					var m = document.cookie.match(/(?:^|; )tz=([^;]*)/);
					if (tz && (!m || decodeURIComponent(m[1]) !== tz)) {
						document.cookie =
							'tz=' + encodeURIComponent(tz) + '; path=/; max-age=31536000; samesite=lax';
						if (!m && /(?:^|; )tz=/.test(document.cookie)) location.reload();
					}
					var t = document.cookie.match(/(?:^|; )theme=(light|dark)/);
					if (t) document.documentElement.dataset.theme = t[1];
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
